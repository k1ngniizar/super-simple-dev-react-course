<!DOCTYPE html>
<html>

<head>
  <title>Chatbot</title>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">

    function ChatInput({ chatMessages, setChatMessages }) {
      const [inputText, setInputText] = React.useState("")

      function setMessage(event) {
        const message = event.target.value
        setInputText(message)
      }

      async function sendMessage() {
        const newChatMessage = [
          ...chatMessages,
          {
            message: inputText,
            sender: "user",
            id: crypto.randomUUID()
          }
        ]

        // setChatMessages(newChatMessage)

        const response = await Chatbot.getResponseAsync(inputText)

        setChatMessages([
          ...newChatMessage,
          {
            message: response,
            sender: "robot",
            id: crypto.randomUUID()
          }
        ])

        setInputText("")
      }
      return (
        <>
          <input value={inputText} onChange={setMessage} />
          <button onClick={sendMessage}>Send</button>
        </>
      )
    }

    function ChatMessage({ message, sender, id }) {
      const [loading, setLoading] = React.useState(true)
      React.useEffect(() => {
        setTimeout(() => {
          setLoading(false)
        }, 1500);
      }, [id])

      const checkSender = sender === "user";

      return (
        <div>
          {!checkSender && (
            <>
              {
                loading ? "loading" : <img src="robot.png" width="50" />
              }
            </>
          )}

          {
            !checkSender && loading ? "loading" : message
          }
          {checkSender && <img src="user.png" width="50" />}
        </div>
      )
    }

    function ChatMessages({ chatMessages }) {

      return (
        <>
          {
            chatMessages.map(chatMessage => {
              return (
                <ChatMessage key={chatMessage.id} message={chatMessage.message} sender={chatMessage.sender} />
              )
            })
          }
        </>
      )
    }

    function App() {
      const [chatMessages, setChatMessages] = React.useState([])

      return (
        <div>
          <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
          {chatMessages.length === 0 && <p>Welcome to the chatbot project! Send a message using the textbox above.</p>}
          <ChatMessages chatMessages={chatMessages} />
        </div>
      )

    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>

</html>
